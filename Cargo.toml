[workspace]
members = [
    "crates/jjs-modules",
    "crates/jjs-email-contract",
    "modules/node-http",
    "modules/node-events",
    "modules/node-url",
    "modules/node-buffer",
    "modules/node-querystring",
    "modules/node-fs",
    "modules/node-path",
    "modules/express",
    "modules/cookie-parser",
    "modules/express-session",
    "modules/nodemailer",
    "modules/hazelcast",
    "modules/rate-limit",
    "modules/json-schema",
    "modules/service",
    "modules/text",
    "modules/schedule",
    "modules/tps-fetch",
    "modules/tps-evidence",
    "modules/tps-notify",
    "modules/tps-secrets",
    "modules/jjs-crypto",
    "modules/resvg",
    "modules/sqlite3",
    "modules/better-sqlite3",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
jjs = { git = "https://github.com/userlite/jjs.git", rev = "84e79f391c848574a23d2da1514ee024290a7c3a", default-features = false }
jjs-module-api = { git = "https://github.com/userlite/jjs.git", rev = "84e79f391c848574a23d2da1514ee024290a7c3a" }
