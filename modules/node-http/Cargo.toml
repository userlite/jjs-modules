[package]
name = "jjs-module-node-http"
version = "0.1.0"
edition = "2021"
description = "Rust-native node:http module for JJS"
license = "MIT"

[dependencies]
jjs-module-node-buffer = { path = "../node-buffer" }
jjs-module-node-events = { path = "../node-events" }
jjs-module-api.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jjs = { workspace = true, features = ["jit"] }
